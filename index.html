<!DOCTYPE html>

<html lang="vi">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1" />


  <title>
    VR Room - Mac and VR Door Support
  </title>


  <!-- ======================================================
       A-FRAME
  ======================================================= -->

  <script
    src="https://aframe.io/releases/1.5.0/aframe.min.js">
  </script>


  <!-- ======================================================
       MOVEMENT CONTROLS

       Keyboard
       Touch
       VR thumbsticks
  ======================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js">
  </script>


  <!-- ======================================================
       BLINK TELEPORT
  ======================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js">
  </script>


  <!-- ======================================================
       STYLE
  ======================================================= -->

  <style>

    body {

      margin: 0;

      overflow: hidden;

      background: #020202;
    }


    #vignette {

      position: fixed;

      inset: 0;

      z-index: 999;

      pointer-events: none;


      background:

        radial-gradient(

          ellipse at center,

          rgba(0, 0, 0, 0) 50%,

          rgba(5, 8, 5, 0.5) 100%
        );
    }


    #soundButton {

      position: fixed;

      top: 16px;

      left: 16px;

      z-index: 1000;


      padding: 12px 18px;


      border:
        1px solid
        rgba(255, 255, 255, 0.75);


      border-radius: 8px;


      color: white;


      background:
        rgba(0, 0, 0, 0.82);


      font:
        600 15px Arial,
        sans-serif;


      cursor: pointer;
    }


    #soundButton:disabled {

      opacity: 0.7;

      cursor: default;
    }

  </style>


  <!-- ======================================================
       SPLIT JAVASCRIPT FILES

       These are all beside index.html
       in your current folder.
  ======================================================= -->

  <script
    src="engine-environment.js">
  </script>


  <script
    src="engine-interactions.js">
  </script>


  <script
    src="audio.js">
  </script>


  <script
    src="story.js">
  </script>


  <script
    src="ui-scare.js">
  </script>

</head>


<body>


  <!-- ======================================================
       VIGNETTE
  ======================================================= -->

  <div
    id="vignette">
  </div>


  <!-- ======================================================
       SOUND BUTTON
  ======================================================= -->

  <button

    id="soundButton"

    type="button"

    onclick="enableSound()">

    ENABLE SOUND

  </button>


  <!-- ======================================================
       AUDIO
  ======================================================= -->


  <!-- Ceiling fan -->

  <audio

    id="fanAudio"

    src="sounds/73347__noisecollector__noisy_ceiling_fan.mp3"

    preload="auto"

    loop

    playsinline>

  </audio>


  <!-- Bedroom rain -->

  <audio

    id="bedroomRainAudio"

    src="sounds/bedroom-rain.wav"

    preload="auto"

    loop

    playsinline>

  </audio>


  <!-- Fluorescent light -->

  <audio

    id="fluorescentAudio"

    src="sounds/fluorescent-light.wav"

    preload="auto"

    loop

    playsinline>

  </audio>


  <!-- TV static -->

  <audio

    id="tvStaticAudio"

    src="sounds/tv-static.mp3"

    preload="auto"

    loop

    playsinline>

  </audio>


  <!-- Player footsteps -->

  <audio

    id="footstepAudio"

    src="sounds/842186__aardsreal__footstep-floor.wav"

    preload="auto"

    loop

    playsinline>

  </audio>


  <!-- ======================================================
       A-FRAME SCENE
  ======================================================= -->

  <a-scene


    background="
      color: #020202"


    fog="
      type: exponential;
      color: #050805;
      density: 0.025"


    renderer="
      colorManagement: true;
      physicallyCorrectLights: true"


    loading-screen="
      enabled: true;
      dotsColor: white;
      backgroundColor: black"


    webxr="
      optionalFeatures:
        local-floor,
        bounded-floor">


    <!-- ====================================================
         LIGHTS
    ===================================================== -->


    <a-light

      type="ambient"

      color="#1c261c"

      intensity="0.6">

    </a-light>



    <a-entity

      position="-3.5 2.6 -1"


      light="
        type: point;
        color: #7cb860;
        intensity: 7;
        distance: 12;
        decay: 2;
        castShadow: false"


      flicker="
        min: 5.5;
        max: 7.5;
        speed: 0.3">

    </a-entity>



    <a-entity

      position="2.5 2.6 1.5"


      light="
        type: point;
        color: #ffdb59;
        intensity: 8;
        distance: 15;
        decay: 2;
        castShadow: false"


      flicker="
        min: 6.5;
        max: 8.5;
        speed: 0.2">

    </a-entity>


    <!-- ====================================================
         SPLIT ROOM MODELS
    ===================================================== -->


    <!-- WALL + GROUND -->

    <a-entity

      id="wallandground"

      class="roompart"

      gltf-model="url(wallandground.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Walls and ground">

    </a-entity>



    <!-- LIVING ROOM -->

    <a-entity

      id="living"

      class="roompart"

      gltf-model="url(livingasset.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Living room">

    </a-entity>



    <!-- KITCHEN -->

    <a-entity

      id="kitchen"

      class="roompart"

      gltf-model="url(kitchenasset.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Kitchen">

    </a-entity>



    <!-- BEDROOM -->

    <a-entity

      id="bedroom"

      class="roompart"

      gltf-model="url(bedroomasset.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Bedroom">

    </a-entity>



    <!-- TOILET -->

    <a-entity

      id="toilet"

      class="roompart"

      gltf-model="url(toiletasset.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Toilet">

    </a-entity>



    <!-- BAN THO -->

    <a-entity

      id="bantho"

      class="roompart"

      gltf-model="url(bantho.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Ban tho">

    </a-entity>


    <!-- ====================================================
         FALLBACK TELEPORT FLOOR
    ===================================================== -->

    <a-plane

      id="fallback-teleport-floor"

      class="floor"


      position="0 0.01 0"


      rotation="-90 0 0"


      width="30"

      height="30"


      material="
        opacity: 0;
        transparent: true;
        depthWrite: false">

    </a-plane>


    <!-- ====================================================
         INTERACTIVE DOOR
    ===================================================== -->

    <a-entity

      id="door"

      class="door"


      gltf-model="url(cua.glb)"


      position="0 0 0"


      rotation="0 0 0"


      door-hinge="
        openAngle: 100;
        hingeSide: left;
        direction: 1;
        duration: 650"


      model-status="
        name: Door">

    </a-entity>


    <!-- ====================================================
         INTERACTIVE TEDDY
    ===================================================== -->

    <a-entity

      id="teddy"

      class="item interactable"


      gltf-model="url(teddy.glb)"


      position="0 0 0"


      natural-grabbable


      model-status="
        name: Teddy bear"


      animation__hoverin="
        property: scale;
        to: 1.1 1.1 1.1;
        startEvents: mouseenter;
        dur: 200"


      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">

    </a-entity>


    <!-- ====================================================
         INTERACTIVE HAIRPIN

         Keep this only when hairpin.glb exists.
    ===================================================== -->

    <a-entity

      id="hairpin"

      class="item interactable"


      gltf-model="url(hairpin.glb)"


      position="0 0 0"


      natural-grabbable


      model-status="
        name: Hairpin"


      animation__hoverin="
        property: scale;
        to: 1.2 1.2 1.2;
        startEvents: mouseenter;
        dur: 200"


      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">

    </a-entity>


    <!-- ====================================================
         STORY / SCARE SYSTEM
    ===================================================== -->

    <a-entity

      id="story-manager"

      story-manager>

    </a-entity>



    <a-entity

      jumpscare-controller>

    </a-entity>



    <a-entity

      id="scare-character"

      gltf-model="url(scare.glb)"

      position="0 0 0"

      visible="false">

    </a-entity>


    <!-- ====================================================
         PLAYER RIG
    ===================================================== -->

    <a-entity

      id="rig"


      position="1 0.08 0.5"


      movement-controls="
        speed: 0.15;
        controls: gamepad, keyboard, touch;
        fly: false"


      quest-room-collider="
        objects: [gltf-model];
        radius: 0.32;
        skin: 0.035;
        maxSubstep: 0.12;
        teleportDistance: 0.75"


      footstep-player="
        minSpeed: 0.02;
        maxSpeed: 4">


      <!-- ==================================================
           CAMERA
      =================================================== -->

      <a-entity

        id="cam"


        camera="
          near: 0.01;
          fov: 60"


        position="0 1.6 0"


        look-controls


        head-bob="
          verticalAmount: 0.026;
          sideAmount: 0.014;
          speed: 8.5;
          vrMultiplier: 0.3">


        <!-- ================================================
             DESKTOP HOLD POSITION
        ================================================= -->

        <a-entity

          id="desktopHold"

          position="0 -0.25 -1">

        </a-entity>


        <!-- ================================================
             DESKTOP CROSSHAIR
        ================================================= -->

        <a-cursor

          color="#ffffff"


          scale="0.7 0.7 0.7"


          cursor="
            rayOrigin: entity;
            fuse: false"


          raycaster="
            objects:
              #door,
              .door-press-target,
              .item;
            far: 6;
            interval: 50">

        </a-cursor>

      </a-entity>


      <!-- ==================================================
           LEFT QUEST CONTROLLER

           Trigger = teleport
           Grip = pickup
      =================================================== -->

      <a-entity

        id="leftHand"


        hand-controls="
          hand: left"


        blink-controls="
          cameraRig: #rig;
          teleportOrigin: #cam;
          collisionEntities: .floor;
          button: trigger;
          snapTurn: false;
          rotateOnTeleport: false"


        natural-grab-hand="
          radius: 0.4;
          velocitySmoothing: 0.35">

      </a-entity>


      <!-- ==================================================
           RIGHT QUEST CONTROLLER

           Trigger = door
           Grip = pickup
      =================================================== -->

      <a-entity

        id="rightHand"


        hand-controls="
          hand: right"


        raycaster="
          objects:
            #door,
            .door-press-target;
          far: 6;
          interval: 50;
          showLine: true;
          lineColor: #ffffff;
          lineOpacity: 0.8"


        natural-grab-hand="
          radius: 0.4;
          velocitySmoothing: 0.35"


        vr-door-interactor>

      </a-entity>


    </a-entity>


  </a-scene>


</body>

</html>
