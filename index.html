<!DOCTYPE html>
<html lang="vi">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1" />

  <title>Rooms Within</title>


  <!-- ======================================================
       A-FRAME
  ======================================================= -->

  <script
    src="https://aframe.io/releases/1.5.0/aframe.min.js">
  </script>


  <!-- ======================================================
       MOVEMENT
  ======================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js">
  </script>


  <!-- ======================================================
       QUEST TELEPORT
  ======================================================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js">
  </script>


  <!-- ======================================================
       STYLE
  ======================================================= -->

  <style>

    body {
      margin: 0;
      overflow: hidden;
      background: #020202;
    }


    /* ------------------------------------------------------
       VIGNETTE
    ------------------------------------------------------ */

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;

      background:
        radial-gradient(
          ellipse at center,
          rgba(0, 0, 0, 0) 50%,
          rgba(5, 8, 5, 0.5) 100%
        );
    }


    /* ------------------------------------------------------
       ENABLE SOUND BUTTON
    ------------------------------------------------------ */

    #soundButton {
      position: fixed;
      top: 16px;
      left: 16px;

      z-index: 1000;

      padding: 12px 18px;

      border:
        1px solid
        rgba(255, 255, 255, 0.75);

      border-radius: 8px;

      color: white;

      background:
        rgba(0, 0, 0, 0.82);

      font:
        600 15px Arial,
        sans-serif;

      cursor: pointer;
    }


    #soundButton:disabled {
      opacity: 0.7;
      cursor: default;
    }


    /* ======================================================
       MAC VR BUTTONS
    ======================================================= */

    .screen-vr-control {
      position: fixed;

      top:
        max(
          12px,
          env(safe-area-inset-top)
        );

      z-index: 1005;

      width: 36px;
      height: 36px;

      padding: 0;

      display: none;

      align-items: center;
      justify-content: center;

      border:
        1px solid
        rgba(255, 255, 255, 0.24);

      border-radius: 999px;

      color: #ffffff;

      background:
        rgba(17, 19, 23, 0.94);

      box-shadow:
        0 5px 18px
        rgba(0, 0, 0, 0.42);

      cursor: pointer;

      opacity: 0.92;
    }


    .screen-vr-control.is-visible {
      display: flex;
    }


    .screen-vr-control:hover {
      opacity: 1;

      transform:
        scale(1.06);
    }


    .screen-vr-control svg {
      width: 19px;
      height: 19px;

      pointer-events: none;
    }


    #screenSettingsButton {
      left:
        max(
          12px,
          env(safe-area-inset-left)
        );
    }


    #screenExitButton {
      right:
        max(
          12px,
          env(safe-area-inset-right)
        );
    }


    /* ======================================================
       SETTINGS PANEL
    ======================================================= */

    #screenSettingsPanel {
      position: fixed;

      top:
        max(
          58px,
          calc(
            env(safe-area-inset-top)
            + 58px
          )
        );

      left:
        max(
          12px,
          env(safe-area-inset-left)
        );

      z-index: 1005;

      display: none;

      align-items: center;

      gap: 7px;

      padding: 9px;

      border:
        1px solid
        rgba(255, 255, 255, 0.16);

      border-radius: 12px;

      background:
        rgba(12, 13, 16, 0.93);

      box-shadow:
        0 8px 24px
        rgba(0, 0, 0, 0.44);
    }


    #screenSettingsPanel.is-open {
      display: flex;
    }


    .settings-mini-button {
      min-width: 34px;
      height: 30px;

      border:
        1px solid
        rgba(255, 255, 255, 0.16);

      border-radius: 8px;

      color: #ffffff;

      background:
        rgba(255, 255, 255, 0.07);

      cursor: pointer;

      font:
        600 14px Arial,
        sans-serif;
    }


    #screenVolumeLabel {
      min-width: 42px;

      color: #ffffff;

      text-align: center;

      font:
        600 11px Arial,
        sans-serif;
    }

  </style>


  <!-- ======================================================
       SPLIT JAVASCRIPT FILES

       Your files are at the root beside index.html.
  ======================================================= -->

  <script src="engine-environment.js"></script>

  <script src="engine-interactions.js"></script>

  <script src="audio.js"></script>

  <script src="story.js"></script>

  <script src="ui-scare.js"></script>

</head>


<body>


  <!-- ======================================================
       VIGNETTE
  ======================================================= -->

  <div id="vignette"></div>


  <!-- ======================================================
       ENABLE SOUND
  ======================================================= -->

  <button
    id="soundButton"
    type="button"
    onclick="enableSound()">

    ENABLE SOUND

  </button>


  <!-- ======================================================
       MAC SETTINGS BUTTON
  ======================================================= -->

  <button
    id="screenSettingsButton"

    class="screen-vr-control"

    type="button"

    aria-label="Settings"

    title="Settings"

    onclick="toggleRoomsSettings()">


    <svg
      viewBox="0 0 24 24"

      fill="none"

      stroke="currentColor"

      stroke-width="1.7"

      stroke-linecap="round"

      stroke-linejoin="round">


      <circle
        cx="12"
        cy="12"
        r="3.2">
      </circle>


      <circle
        cx="12"
        cy="12"
        r="7.1">
      </circle>


      <path
        d="
          M12 2.8v2.2
          M12 19v2.2
          M2.8 12H5
          M19 12h2.2">
      </path>


      <path
        d="
          M5.5 5.5l1.6 1.6
          M16.9 16.9l1.6 1.6
          M18.5 5.5l-1.6 1.6
          M7.1 16.9l-1.6 1.6">
      </path>

    </svg>

  </button>


  <!-- ======================================================
       MAC SETTINGS PANEL
  ======================================================= -->

  <div id="screenSettingsPanel">


    <button
      class="settings-mini-button"

      type="button"

      onclick="changeRoomsVolume(-0.1)">

      −

    </button>


    <span id="screenVolumeLabel">

      100%

    </span>


    <button
      class="settings-mini-button"

      type="button"

      onclick="toggleRoomsMute()">

      ♪

    </button>


    <button
      class="settings-mini-button"

      type="button"

      onclick="changeRoomsVolume(0.1)">

      +

    </button>

  </div>


  <!-- ======================================================
       MAC EXIT
  ======================================================= -->

  <button
    id="screenExitButton"

    class="screen-vr-control"

    type="button"

    aria-label="Exit VR or fullscreen"

    title="Exit"

    onclick="exitRoomsWithin()">


    <svg
      viewBox="0 0 24 24"

      fill="none"

      stroke="currentColor"

      stroke-width="1.8"

      stroke-linecap="round"

      stroke-linejoin="round">


      <path
        d="
          M10 5H6.8
          A1.8 1.8 0 0 0 5 6.8
          v10.4
          A1.8 1.8 0 0 0 6.8 19
          H10">
      </path>


      <path
        d="M13 8l4 4-4 4">
      </path>


      <path
        d="M9 12h8">
      </path>

    </svg>

  </button>


  <!-- ======================================================
       FOOTSTEP AUDIO
  ======================================================= -->

  <audio
    id="footstepAudio"

    src="sounds/842186__aardsreal__footstep-floor.wav"

    preload="auto"

    loop

    playsinline>
  </audio>


  <!-- ======================================================
       SCARE FOOTSTEP AUDIO
  ======================================================= -->

  <audio
    id="scareFootstepAudio"

    src="sounds/842186__aardsreal__footstep-floor.wav"

    preload="auto"

    playsinline>
  </audio>


  <!-- ======================================================
       A-FRAME SCENE
  ======================================================= -->

  <a-scene

    ui-flow-manager

    spatial-audio-manager


    background="
      color: #020202"


    fog="
      type: exponential;
      color: #050805;
      density: 0.025"


    renderer="
      colorManagement: true;
      physicallyCorrectLights: true"


    loading-screen="
      enabled: true;
      dotsColor: white;
      backgroundColor: black"


    webxr="
      optionalFeatures:
        local-floor,
        bounded-floor">


    <!-- ====================================================
         LIGHTING
    ===================================================== -->


    <a-light

      type="ambient"

      color="#1c261c"

      intensity="0.6">

    </a-light>


    <!-- GREEN LIGHT -->

    <a-entity

      position="-3.5 2.6 -1"


      light="
        type: point;
        color: #7cb860;
        intensity: 7;
        distance: 12;
        decay: 2;
        castShadow: false"


      flicker="
        min: 5.5;
        max: 7.5;
        speed: 0.3">

    </a-entity>


    <!-- WARM LIGHT -->

    <a-entity

      position="2.5 2.6 1.5"


      light="
        type: point;
        color: #ffdb59;
        intensity: 8;
        distance: 15;
        decay: 2;
        castShadow: false"


      flicker="
        min: 6.5;
        max: 8.5;
        speed: 0.2">

    </a-entity>


    <!-- ====================================================
         WALL + FLOOR
    ===================================================== -->

    <a-entity

      id="wallandground"

      class="roompart"

      gltf-model="url(wallandground.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Walls and ground">

    </a-entity>


    <!-- ====================================================
         LIVING ROOM

         IMPORTANT:

         The real CRT TV is already inside this GLB.

         NO fake TV plane is created here anymore.
    ===================================================== -->

    <a-entity

      id="living"

      class="roompart"

      gltf-model="url(livingasset.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Living room">

    </a-entity>


    <!-- ====================================================
         KITCHEN
    ===================================================== -->

    <a-entity

      id="kitchen"

      class="roompart"

      gltf-model="url(kitchenasset.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Kitchen">

    </a-entity>


    <!-- ====================================================
         BEDROOM
    ===================================================== -->

    <a-entity

      id="bedroom"

      class="roompart"

      gltf-model="url(bedroomasset.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Bedroom">

    </a-entity>


    <!-- ====================================================
         TOILET
    ===================================================== -->

    <a-entity

      id="toilet"

      class="roompart"

      gltf-model="url(toiletasset.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Toilet">

    </a-entity>


    <!-- ====================================================
         BAN THO / OFFERING TABLE
    ===================================================== -->

    <a-entity

      id="bantho"

      class="roompart"

      gltf-model="url(bantho.glb)"

      position="0 0 0"

      tag-floors

      model-status="
        name: Ban tho">

    </a-entity>


    <!-- ====================================================
         FALLBACK TELEPORT FLOOR
    ===================================================== -->

    <a-plane

      id="fallback-teleport-floor"

      class="floor"


      position="0 0.01 0"


      rotation="-90 0 0"


      width="30"

      height="30"


      material="
        opacity: 0;
        transparent: true;
        depthWrite: false">

    </a-plane>


    <!-- ====================================================
         DOOR
    ===================================================== -->

    <a-entity

      id="door"

      class="door"


      gltf-model="url(cua.glb)"


      position="0 0 0"


      rotation="0 0 0"


      door-hinge="
        openAngle: 100;
        hingeSide: left;
        direction: 1;
        duration: 650"


      model-status="
        name: Door">

    </a-entity>


    <!-- ====================================================
         TEDDY
    ===================================================== -->

    <a-entity

      id="teddy"

      class="item interactable"


      gltf-model="url(teddy.glb)"


      position="0 0 0"


      natural-grabbable


      model-status="
        name: Teddy bear"


      animation__hoverin="
        property: scale;
        to: 1.1 1.1 1.1;
        startEvents: mouseenter;
        dur: 200"


      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">

    </a-entity>


    <!-- ====================================================
         STORY MANAGER
    ===================================================== -->

    <a-entity

      id="story-manager"

      story-manager>

    </a-entity>


    <!-- ====================================================
         JUMPSCARE
    ===================================================== -->

    <a-entity
      jumpscare-controller>
    </a-entity>


    <!--
      Placeholder until scare model is ready.
    -->

    <a-entity

      id="scare-character"

      position="0 0 0"

      visible="false">

    </a-entity>


    <!-- ====================================================
         PLAYER RIG
    ===================================================== -->

    <a-entity

      id="rig"


      position="1 0.08 0.5"


      movement-controls="
        speed: 0.15;
        controls: gamepad, keyboard, touch;
        fly: false"


      quest-room-collider="
        objects: [gltf-model];
        radius: 0.32;
        skin: 0.035;
        maxSubstep: 0.12;
        teleportDistance: 0.75"


      footstep-player="
        minSpeed: 0.02;
        maxSpeed: 4">


      <!-- ==================================================
           CAMERA
      =================================================== -->

      <a-entity

        id="cam"


        camera="
          near: 0.01;
          fov: 60"


        position="0 1.6 0"


        look-controls


        head-bob="
          verticalAmount: 0.026;
          sideAmount: 0.014;
          speed: 8.5;
          vrMultiplier: 0.3">


        <!-- ================================================
             QUEST SETTINGS BUTTON
        ================================================= -->

        <a-circle

          id="vrSettingsButton"

          class="vr-control"

          visible="false"


          camera-corner-ui="
            side: left;
            distance: 2;
            horizontalInset: 0.13;
            verticalInset: 0.16"


          radius="0.044"

          segments="40"


          material="
            color: #17191c;
            opacity: 0.94;
            transparent: true;
            shader: flat;
            side: double">


          <a-ring

            radius-inner="0.038"

            radius-outer="0.044"

            segments-theta="40"

            position="0 0 0.002"


            material="
              color: #69758d;
              shader: flat;
              side: double">

          </a-ring>


          <a-ring

            radius-inner="0.010"

            radius-outer="0.017"

            segments-theta="24"

            position="0 0 0.006"


            material="
              color: #ffffff;
              shader: flat;
              side: double">

          </a-ring>


          <a-plane

            width="0.036"

            height="0.004"

            position="0 0 0.007"


            material="
              color: #ffffff;
              shader: flat;
              side: double">

          </a-plane>


          <a-plane

            width="0.036"

            height="0.004"

            rotation="0 0 60"

            position="0 0 0.008"


            material="
              color: #ffffff;
              shader: flat;
              side: double">

          </a-plane>


          <a-plane

            width="0.036"

            height="0.004"

            rotation="0 0 120"

            position="0 0 0.009"


            material="
              color: #ffffff;
              shader: flat;
              side: double">

          </a-plane>

        </a-circle>


        <!-- ================================================
             QUEST EXIT BUTTON
        ================================================= -->

        <a-circle

          id="vrExitButton"

          class="vr-control"

          visible="false"


          camera-corner-ui="
            side: right;
            distance: 2;
            horizontalInset: 0.13;
            verticalInset: 0.16"


          radius="0.044"

          segments="40"


          material="
            color: #17191c;
            opacity: 0.94;
            transparent: true;
            shader: flat;
            side: double">


          <a-ring

            radius-inner="0.038"

            radius-outer="0.044"

            segments-theta="40"

            position="0 0 0.002"


            material="
              color: #a64a4a;
              shader: flat;
              side: double">

          </a-ring>


          <a-plane

            width="0.004"

            height="0.032"

            position="-0.014 0 0.006"


            material="
              color: #ffffff;
              shader: flat;
              side: double">

          </a-plane>


          <a-plane

            width="0.031"

            height="0.004"

            position="0.003 0 0.007"


            material="
              color: #ffffff;
              shader: flat;
              side: double">

          </a-plane>


          <a-plane

            width="0.016"

            height="0.004"

            rotation="0 0 45"

            position="0.016 0.006 0.008"


            material="
              color: #ffffff;
              shader: flat;
              side: double">

          </a-plane>


          <a-plane

            width="0.016"

            height="0.004"

            rotation="0 0 -45"

            position="0.016 -0.006 0.009"


            material="
              color: #ffffff;
              shader: flat;
              side: double">

          </a-plane>

        </a-circle>


        <!-- ================================================
             QUEST SETTINGS PANEL
        ================================================= -->

        <a-entity

          id="vrSettingsPanel"

          visible="false"

          position="-0.48 0.27 -1.8">


          <a-plane

            width="0.34"

            height="0.115"


            material="
              color: #111318;
              opacity: 0.94;
              transparent: true;
              shader: flat;
              side: double">

          </a-plane>


          <!-- VOLUME DOWN -->

          <a-circle

            id="vrVolumeDown"

            class="vr-control"

            radius="0.026"

            position="-0.10 0 0.008"


            material="
              color: #333944;
              shader: flat;
              side: double">


            <a-text

              value="-"

              align="center"

              width="0.46"

              position="0 0 0.004"

              color="#ffffff">

            </a-text>

          </a-circle>


          <!-- VOLUME LABEL -->

          <a-text

            id="vrVolumeLabel"

            value="100%"

            align="center"

            width="0.42"

            position="0 0 0.008"

            color="#ffffff">

          </a-text>


          <!-- MUTE -->

          <a-circle

            id="vrMuteButton"

            class="vr-control"

            radius="0.026"

            position="0.10 0 0.008"


            material="
              color: #333944;
              shader: flat;
              side: double">


            <a-text

              id="vrMuteLabel"

              value="M"

              align="center"

              width="0.35"

              position="0 0 0.004"

              color="#ffffff">

            </a-text>

          </a-circle>


          <!-- VOLUME UP -->

          <a-circle

            id="vrVolumeUp"

            class="vr-control"

            radius="0.026"

            position="0.15 0 0.008"


            material="
              color: #333944;
              shader: flat;
              side: double">


            <a-text

              value="+"

              align="center"

              width="0.42"

              position="0 0 0.004"

              color="#ffffff">

            </a-text>

          </a-circle>

        </a-entity>


        <!-- ================================================
             DESKTOP HOLD POINT
        ================================================= -->

        <a-entity

          id="desktopHold"

          position="0 -0.25 -1">

        </a-entity>


        <!-- ================================================
             MAC CROSSHAIR

             TV has deliberately been REMOVED from
             this raycaster until we connect to the
             real TV mesh inside livingasset.glb.
        ================================================= -->

        <a-cursor

          color="#ffffff"

          scale="0.7 0.7 0.7"


          cursor="
            rayOrigin: entity;
            fuse: false"


          raycaster="
            objects:
              #door,
              #doorCloseTarget,
              .item;
            far: 3;
            interval: 50">

        </a-cursor>

      </a-entity>


      <!-- ==================================================
           LEFT QUEST CONTROLLER

           Trigger = teleport
           Grip = pickup
      =================================================== -->

      <a-entity

        id="leftHand"


        hand-controls="
          hand: left"


        blink-controls="
          cameraRig: #rig;
          teleportOrigin: #cam;
          collisionEntities: .floor;
          button: trigger;
          snapTurn: false;
          rotateOnTeleport: false"


        natural-grab-hand="
          radius: 0.4;
          velocitySmoothing: 0.35">

      </a-entity>


      <!-- ==================================================
           RIGHT QUEST CONTROLLER

           Trigger:
           - doors
           - VR UI

           TV trigger is temporarily removed
           until we connect to the REAL TV mesh.
      =================================================== -->

      <a-entity

        id="rightHand"


        hand-controls="
          hand: right"


        raycaster="
          objects:
            #door,
            #doorCloseTarget,
            .vr-control;
          far: 3;
          interval: 50;
          showLine: true;
          lineColor: #ffffff;
          lineOpacity: 0.8"


        natural-grab-hand="
          radius: 0.4;
          velocitySmoothing: 0.35"


        vr-door-interactor


        vr-ui-interactor>

      </a-entity>


    </a-entity>


  </a-scene>


</body>

</html>
