<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Rooms Within - Independent Ambient Sound Breaks</title>

  <!-- A-Frame -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>

  <!-- movement-controls for keyboard, touch and VR thumbsticks -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>

  <!-- Blink teleport -->
  <script src="https://cdn.jsdelivr.net/npm/aframe-blink-controls@0.4.3/dist/aframe-blink-controls.min.js"></script>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #020202;
    }

    #vignette {
      position: fixed;
      inset: 0;
      z-index: 999;
      pointer-events: none;

      background: radial-gradient(
        ellipse at center,
        rgba(0, 0, 0, 0) 50%,
        rgba(5, 8, 5, 0.5) 100%
      );
    }

    #soundButton {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 1000;

      padding: 12px 18px;
      border: 1px solid rgba(255, 255, 255, 0.75);
      border-radius: 8px;

      color: white;
      background: rgba(0, 0, 0, 0.82);

      font: 600 15px Arial, sans-serif;
      cursor: pointer;
    }

    #soundButton:disabled {
      opacity: 0.7;
      cursor: default;
    }

    /*
      True screen-corner control for Mac/browser fullscreen.
      It is a compact circular icon rather than a text panel.
    */
    #screenExitButton {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 1005;

      width: 36px;
      height: 36px;
      padding: 0;

      display: none;
      align-items: center;
      justify-content: center;

      border: 1px solid rgba(255, 255, 255, 0.26);
      border-radius: 999px;

      color: #ffffff;
      background:
        linear-gradient(
          145deg,
          rgba(32, 34, 38, 0.94),
          rgba(11, 12, 14, 0.94)
        );

      box-shadow:
        0 5px 18px rgba(0, 0, 0, 0.42),
        inset 0 1px 0 rgba(255, 255, 255, 0.11);

      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);

      cursor: pointer;
      opacity: 0.88;

      transition:
        transform 120ms ease,
        opacity 120ms ease,
        border-color 120ms ease,
        background 120ms ease;
    }

    #screenExitButton.is-visible {
      display: flex;
    }

    #screenExitButton:hover {
      opacity: 1;
      transform: scale(1.08);
      border-color: rgba(255, 126, 126, 0.78);
      background:
        linear-gradient(
          145deg,
          rgba(64, 27, 31, 0.97),
          rgba(18, 12, 14, 0.97)
        );
    }

    #screenExitButton:active {
      transform: scale(0.95);
    }

    #screenExitButton svg {
      width: 19px;
      height: 19px;
      pointer-events: none;
    }


  </style>
</head>

<body>
  <div id="vignette"></div>
  <button id="soundButton" type="button" onclick="enableSound()">
    ENABLE SOUND
  </button>
  <button
    id="screenExitButton"
    type="button"
    aria-label="Exit fullscreen or VR"
    title="Exit fullscreen"
    onclick="exitRoomsWithin()">

    <!-- Door-and-arrow icon -->
    <svg
      viewBox="0 0 24 24"
      aria-hidden="true"
      fill="none"
      stroke="currentColor"
      stroke-width="1.8"
      stroke-linecap="round"
      stroke-linejoin="round">

      <path d="M10 5H6.8A1.8 1.8 0 0 0 5 6.8v10.4A1.8 1.8 0 0 0 6.8 19H10" />
      <path d="M13 8l4 4-4 4" />
      <path d="M9 12h8" />
    </svg>
  </button>

  <!--
    Footsteps remain a normal audio element because they belong to
    the player. Room ambience is now emitted by positional A-Frame
    sound sources placed inside the 3D world.
  -->
  <audio
    id="footstepAudio"
    src="sounds/842186__aardsreal__footstep-floor.wav"
    preload="auto"
    loop
    playsinline>
  </audio>

  <script>
    /* ============================================================
       INDEPENDENT POSITIONAL AMBIENCE

       Each room sound has its own independent rhythm:

       play -> fade out -> silence -> fade in -> play -> ...

       The sounds are not synchronized, so the room gets breathing
       space instead of four ambience loops constantly piling up.
       Positional 3D hearing is preserved.
    ============================================================ */

    AFRAME.registerComponent(
      'independent-ambient-cycle',
      {
        schema: {
          targetVolume: {
            default: 0.05
          },

          playMin: {
            default: 30
          },

          playMax: {
            default: 60
          },

          silenceMin: {
            default: 8
          },

          silenceMax: {
            default: 15
          },

          fadeIn: {
            default: 2
          },

          fadeOut: {
            default: 2
          },

          startDelay: {
            default: 0
          }
        },

        init: function () {
          this.running = false;
          this.timer = null;
          this.fadeFrame = null;
          this.currentVolume = 0;

          /*
            Keep the source silent until ENABLE SOUND is pressed.
          */
          this.setVolume(0);
        },

        randomBetween: function (
          minimum,
          maximum
        ) {
          if (maximum <= minimum) {
            return minimum;
          }

          return (
            minimum +
            Math.random() *
            (maximum - minimum)
          );
        },

        getSoundComponent: function () {
          return this.el.components.sound;
        },

        setVolume: function (volume) {
          const safeVolume =
            Math.max(
              0,
              Math.min(
                volume,
                this.data.targetVolume
              )
            );

          this.currentVolume =
            safeVolume;

          /*
            Updating the A-Frame sound component's volume preserves
            its positional audio behaviour while changing loudness.
          */
          this.el.setAttribute(
            'sound',
            'volume',
            safeVolume
          );
        },

        clearTimer: function () {
          if (this.timer) {
            window.clearTimeout(
              this.timer
            );

            this.timer = null;
          }
        },

        clearFade: function () {
          if (this.fadeFrame) {
            window.cancelAnimationFrame(
              this.fadeFrame
            );

            this.fadeFrame = null;
          }
        },

        schedule: function (
          callback,
          seconds
        ) {
          this.clearTimer();

          this.timer =
            window.setTimeout(
              callback,
              Math.max(
                0,
                seconds * 1000
              )
            );
        },

        soundIsReady: function () {
          const component =
            this.getSoundComponent();

          if (
            !component ||
            !component.pool
          ) {
            return false;
          }

          return component.pool.children
            .some(
              audio =>
                Boolean(audio.buffer)
            );
        },

        waitUntilReady: function (
          callback
        ) {
          if (!this.running) {
            return;
          }

          if (this.soundIsReady()) {
            callback();
            return;
          }

          /*
            Audio files may still be loading when the user presses
            ENABLE SOUND. Retry quietly instead of losing the source.
          */
          this.schedule(
            () => {
              this.waitUntilReady(
                callback
              );
            },
            0.25
          );
        },

        playSound: function () {
          const component =
            this.getSoundComponent();

          if (!component) {
            return false;
          }

          try {
            component.playSound();
            return true;
          } catch (error) {
            console.warn(
              `Could not start ${this.el.id}.`,
              error
            );

            return false;
          }
        },

        pauseSound: function () {
          const component =
            this.getSoundComponent();

          if (!component) {
            return;
          }

          try {
            component.pauseSound();
          } catch (error) {
            console.warn(
              `Could not pause ${this.el.id}.`,
              error
            );
          }
        },

        fadeTo: function (
          target,
          seconds,
          onComplete
        ) {
          this.clearFade();

          const startVolume =
            this.currentVolume;

          const endVolume =
            Math.max(
              0,
              Math.min(
                target,
                this.data.targetVolume
              )
            );

          const duration =
            Math.max(
              0,
              seconds * 1000
            );

          if (duration === 0) {
            this.setVolume(
              endVolume
            );

            if (onComplete) {
              onComplete();
            }

            return;
          }

          const startTime =
            performance.now();

          const animate =
            (now) => {
              if (!this.running) {
                return;
              }

              const progress =
                Math.min(
                  (now - startTime) /
                  duration,
                  1
                );

              /*
                Smoothstep gives gentler fades than a straight line.
              */
              const eased =
                progress *
                progress *
                (
                  3 -
                  2 * progress
                );

              const volume =
                startVolume +
                (
                  endVolume -
                  startVolume
                ) *
                eased;

              this.setVolume(
                volume
              );

              if (progress < 1) {
                this.fadeFrame =
                  window.requestAnimationFrame(
                    animate
                  );

                return;
              }

              this.fadeFrame = null;

              if (onComplete) {
                onComplete();
              }
            };

          this.fadeFrame =
            window.requestAnimationFrame(
              animate
            );
        },

        beginAudiblePeriod: function () {
          if (!this.running) {
            return;
          }

          this.waitUntilReady(
            () => {
              if (!this.running) {
                return;
              }

              /*
                Start or resume at zero volume first, then fade in.
              */
              this.setVolume(0);
              this.playSound();

              this.fadeTo(
                this.data.targetVolume,
                this.data.fadeIn,
                () => {
                  if (!this.running) {
                    return;
                  }

                  const playSeconds =
                    this.randomBetween(
                      this.data.playMin,
                      this.data.playMax
                    );

                  console.log(
                    `${this.el.id} audible for ${playSeconds.toFixed(1)} seconds.`
                  );

                  this.schedule(
                    () => {
                      this.beginSilentPeriod();
                    },
                    playSeconds
                  );
                }
              );
            }
          );
        },

        beginSilentPeriod: function () {
          if (!this.running) {
            return;
          }

          this.fadeTo(
            0,
            this.data.fadeOut,
            () => {
              if (!this.running) {
                return;
              }

              /*
                The sound is actually paused after fading out.
                It is not merely left playing silently.
              */
              this.pauseSound();

              const silentSeconds =
                this.randomBetween(
                  this.data.silenceMin,
                  this.data.silenceMax
                );

              console.log(
                `${this.el.id} silent for ${silentSeconds.toFixed(1)} seconds.`
              );

              this.schedule(
                () => {
                  this.beginAudiblePeriod();
                },
                silentSeconds
              );
            }
          );
        },

        startCycle: function () {
          if (this.running) {
            return;
          }

          this.running = true;

          this.clearTimer();
          this.clearFade();
          this.setVolume(0);

          const delay =
            Math.max(
              0,
              this.data.startDelay
            );

          if (delay === 0) {
            this.beginAudiblePeriod();
            return;
          }

          console.log(
            `${this.el.id} starts in ${delay.toFixed(1)} seconds.`
          );

          this.schedule(
            () => {
              this.beginAudiblePeriod();
            },
            delay
          );
        },

        stopCycle: function () {
          this.running = false;

          this.clearTimer();
          this.clearFade();

          this.setVolume(0);
          this.pauseSound();
        },

        remove: function () {
          this.stopCycle();
        }
      }
    );


    async function primeFootstepAudio() {
      const footsteps =
        document.querySelector(
          '#footstepAudio'
        );

      if (!footsteps) {
        return;
      }

      const finalVolume = 0.18;

      try {
        footsteps.volume = 0;

        await footsteps.play();

        footsteps.pause();
        footsteps.currentTime = 0;
        footsteps.volume =
          finalVolume;
      } catch (error) {
        footsteps.volume =
          finalVolume;

        console.warn(
          'Footstep audio could not be primed yet.',
          error
        );
      }
    }


    async function enableSound() {
      const button =
        document.querySelector(
          '#soundButton'
        );

      if (!button) {
        return;
      }

      button.textContent =
        'STARTING SOUND...';

      button.disabled = true;

      try {
        const context =
          THREE.AudioContext.getContext();

        if (
          context &&
          (
            context.state ===
              'suspended' ||
            context.state ===
              'interrupted'
          )
        ) {
          await context.resume();
        }
      } catch (error) {
        console.warn(
          'Web Audio could not be resumed.',
          error
        );
      }

      await primeFootstepAudio();

      const emitters =
        document.querySelectorAll(
          '.spatial-sound'
        );

      emitters.forEach(
        (entity) => {
          const cycle =
            entity.components[
              'independent-ambient-cycle'
            ];

          if (cycle) {
            cycle.startCycle();
          }
        }
      );

      const scene =
        document.querySelector(
          'a-scene'
        );

      if (scene) {
        scene.audioUnlocked =
          true;
      }

      button.textContent =
        'SOUND ENABLED';

      window.setTimeout(
        () => {
          button.style.display =
            'none';
        },
        1200
      );

      console.log(
        `${emitters.length} independent positional ambience cycles enabled.`
      );
    }

    window.enableSound =
      enableSound;


    /* ============================================================
       EXIT CONTROLS

       Mac/browser:
       A real HTML button is fixed to the top-right screen corner.

       Quest/WebXR:
       A small 3D icon is kept inside immersive VR, where normal
       browser HTML may not be visible.
    ============================================================ */
    function isImmersiveXR(scene) {
      return Boolean(
        scene &&
        scene.renderer &&
        scene.renderer.xr &&
        scene.renderer.xr.isPresenting
      );
    }

    function updateScreenExitButton() {
      const scene =
        document.querySelector('a-scene');

      const button =
        document.querySelector(
          '#screenExitButton'
        );

      if (!button) {
        return;
      }

      const browserFullscreen =
        Boolean(
          document.fullscreenElement ||
          document.webkitFullscreenElement
        );

      const desktopVRMode =
        Boolean(
          scene &&
          scene.is('vr-mode') &&
          !isImmersiveXR(scene)
        );

      button.classList.toggle(
        'is-visible',
        browserFullscreen ||
        desktopVRMode
      );
    }

    async function exitRoomsWithin() {
      const scene =
        document.querySelector('a-scene');

      try {
        if (
          scene &&
          (
            isImmersiveXR(scene) ||
            scene.is('vr-mode')
          )
        ) {
          const result =
            scene.exitVR();

          if (
            result &&
            typeof result.then === 'function'
          ) {
            await result;
          }
        }
      } catch (error) {
        console.error(
          'Could not leave VR mode.',
          error
        );
      }

      try {
        if (document.fullscreenElement) {
          await document.exitFullscreen();
        } else if (
          document.webkitFullscreenElement &&
          document.webkitExitFullscreen
        ) {
          document.webkitExitFullscreen();
        }
      } catch (error) {
        console.error(
          'Could not leave browser fullscreen.',
          error
        );
      }

      updateScreenExitButton();
    }

    window.exitRoomsWithin =
      exitRoomsWithin;

    document.addEventListener(
      'fullscreenchange',
      updateScreenExitButton
    );

    document.addEventListener(
      'webkitfullscreenchange',
      updateScreenExitButton
    );


    AFRAME.registerComponent('vr-only-ui', {
      init: function () {
        const scene =
          this.el.sceneEl;

        const updateVisibility = () => {
          /*
            The 3D icon is headset-only. Mac uses the true HTML
            screen-corner button instead.
          */
          this.el.setAttribute(
            'visible',
            isImmersiveXR(scene)
          );

          updateScreenExitButton();
        };

        scene.addEventListener(
          'enter-vr',
          () => {
            window.setTimeout(
              updateVisibility,
              250
            );
          }
        );

        scene.addEventListener(
          'exit-vr',
          updateVisibility
        );

        scene.addEventListener(
          'renderstart',
          updateVisibility
        );

        updateVisibility();
      }
    });


    /*
      Dynamically positions the headset icon near the real visual
      upper-right edge based on camera FOV and aspect ratio.
    */
    AFRAME.registerComponent(
      'camera-corner-ui',
      {
        schema: {
          distance: {
            default: 2
          },

          horizontalInset: {
            default: 0.12
          },

          verticalInset: {
            default: 0.14
          }
        },

        init: function () {
          this.lastWidth = 0;
          this.lastHeight = 0;
          this.lastUpdate = 0;
        },

        tick: function (time) {
          if (
            !this.el.getAttribute(
              'visible'
            )
          ) {
            return;
          }

          if (
            time - this.lastUpdate <
            150
          ) {
            return;
          }

          this.lastUpdate = time;

          const cameraEl =
            document.querySelector('#cam');

          const camera =
            cameraEl &&
            cameraEl.getObject3D(
              'camera'
            );

          if (!camera) {
            return;
          }

          const distance =
            this.data.distance;

          const fov =
            THREE.MathUtils.degToRad(
              camera.fov || 60
            );

          const halfHeight =
            Math.tan(fov / 2) *
            distance;

          const aspect =
            camera.aspect ||
            (
              window.innerWidth /
              Math.max(
                window.innerHeight,
                1
              )
            );

          const halfWidth =
            halfHeight * aspect;

          this.el.object3D.position.set(
            halfWidth *
              (
                1 -
                this.data.horizontalInset
              ),
            halfHeight *
              (
                1 -
                this.data.verticalInset
              ),
            -distance
          );
        }
      }
    );


    AFRAME.registerComponent(
      'exit-experience',
      {
        init: function () {
          this.el.addEventListener(
            'click',
            (event) => {
              if (
                event &&
                event.stopPropagation
              ) {
                event.stopPropagation();
              }

              exitRoomsWithin();
            }
          );
        },

        exitExperience: function () {
          return exitRoomsWithin();
        }
      }
    );


    /* ============================================================
       1. FLICKERING LIGHTS
    ============================================================ */
    AFRAME.registerComponent('flicker', {
      schema: {
        min: { default: 0.8 },
        max: { default: 1.2 },
        speed: { default: 0.5 }
      },

      init: function () {
        this.seed = Math.random() * 1000;
      },

      tick: function (timeMs) {
        const time =
          (timeMs * 0.001 * this.data.speed) +
          this.seed;

        const noise = (
          Math.sin(time * 6.1) +
          Math.sin(time * 2.3) +
          Math.sin(time * 11.7)
        ) / 3;

        const intensity =
          this.data.min +
          ((noise + 1) / 2) *
          (this.data.max - this.data.min);

        this.el.setAttribute(
          'light',
          'intensity',
          intensity
        );
      }
    });


    /* ============================================================
       2. MODEL LOAD STATUS
    ============================================================ */
    AFRAME.registerComponent('model-status', {
      schema: {
        name: { default: '3D model' }
      },

      init: function () {
        this.el.addEventListener('model-loaded', () => {
          console.log(
            `${this.data.name} loaded successfully.`
          );

          /*
            Extra diagnostic: log the loaded model's actual WORLD
            bounding box, so if an item is invisible again in the
            future you can immediately see whether its coordinates
            put it inside the room or far outside it, without having
            to reason about baked glTF transforms by hand.
          */
          const root = this.el.getObject3D('mesh');
          if (root) {
            root.updateMatrixWorld(true);
            const box = new THREE.Box3().setFromObject(root);
            if (!box.isEmpty()) {
              const center = new THREE.Vector3();
              box.getCenter(center);
              console.log(
                `  -> ${this.data.name} world bounding box center:`,
                center.toArray().map(n => n.toFixed(2))
              );
            }
          }
        });

        this.el.addEventListener('model-error', (event) => {
          console.error(
            `${this.data.name} failed to load.`,
            event.detail
          );
        });
      }
    });


    /* ============================================================
       3. CREATE TELEPORT FLOORS FROM NAMED BLENDER OBJECTS
    ============================================================ */
    AFRAME.registerComponent('tag-floors', {
      schema: {
        floorNames: {
          type: 'array',

          default: [
            'san nha phong khach',
            'san nha phong an',
            'san nha TOILET',
            'san giat do',
            'SAN PHONG NGU'
          ]
        }
      },

      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const root = this.el.getObject3D('mesh');

          if (!root) {
            return;
          }

          root.updateMatrixWorld(true);

          let container =
            document.querySelector('#generated-teleport-floors');

          if (!container) {
            container = document.createElement('a-entity');
            container.setAttribute(
              'id',
              'generated-teleport-floors'
            );
            this.el.sceneEl.appendChild(container);
          }

          this.data.floorNames.forEach((name) => {
            const object = root.getObjectByName(name);

            if (!object) {
              return;
            }

            object.updateMatrixWorld(true);

            const box =
              new THREE.Box3().setFromObject(object);

            if (box.isEmpty()) {
              return;
            }

            const size = new THREE.Vector3();
            const center = new THREE.Vector3();

            box.getSize(size);
            box.getCenter(center);

            const plane = document.createElement('a-plane');

            plane.setAttribute('class', 'floor');
            plane.setAttribute('rotation', '-90 0 0');

            plane.setAttribute(
              'width',
              Math.max(size.x, 0.1)
            );

            plane.setAttribute(
              'height',
              Math.max(size.z, 0.1)
            );

            plane.setAttribute(
              'position',
              `${center.x} ${box.min.y + 0.02} ${center.z}`
            );

            plane.setAttribute(
              'material',
              'opacity: 0; transparent: true; depthWrite: false'
            );

            container.appendChild(plane);
          });
        });
      }
    });


    /* ============================================================
       4. DESKTOP HEAD BOB
    ============================================================ */
    AFRAME.registerComponent('head-bob', {
      schema: {
        verticalAmount: {
          default: 0.026
        },

        sideAmount: {
          default: 0.014
        },

        speed: {
          default: 8.5
        },

        /*
          Artificial camera motion is kept much gentler inside VR.
        */
        vrMultiplier: {
          default: 0.3
        }
      },

      init: function () {
        this.baseX =
          this.el.object3D.position.x;

        this.baseY =
          this.el.object3D.position.y;

        this.phase = 0;

        this.rig =
          document.querySelector('#rig');

        this.previousRigPosition =
          new THREE.Vector3();

        this.currentRigPosition =
          new THREE.Vector3();

        if (this.rig) {
          this.rig.object3D.getWorldPosition(
            this.previousRigPosition
          );
        }
      },

      tick: function (time, deltaTime) {
        if (!deltaTime || !this.rig) {
          return;
        }

        this.rig.object3D.getWorldPosition(
          this.currentRigPosition
        );

        const deltaX =
          this.currentRigPosition.x -
          this.previousRigPosition.x;

        const deltaZ =
          this.currentRigPosition.z -
          this.previousRigPosition.z;

        const distance =
          Math.sqrt(
            deltaX * deltaX +
            deltaZ * deltaZ
          );

        /*
          Ignore tiny tracking noise and large blink-teleport jumps.
        */
        const isWalking =
          distance > 0.0001 &&
          distance < 0.5;

        const vrScale =
          this.el.sceneEl.is('vr-mode')
            ? this.data.vrMultiplier
            : 1;

        if (isWalking) {
          this.phase +=
            deltaTime *
            0.001 *
            this.data.speed;

          /*
            Human walking has a gentle vertical rise twice per stride,
            while the torso shifts left and right once per stride.
          */
          const targetX =
            this.baseX +
            Math.sin(this.phase) *
            this.data.sideAmount *
            vrScale;

          const targetY =
            this.baseY +
            Math.sin(this.phase * 2) *
            this.data.verticalAmount *
            vrScale;

          this.el.object3D.position.x =
            THREE.MathUtils.lerp(
              this.el.object3D.position.x,
              targetX,
              0.32
            );

          this.el.object3D.position.y =
            THREE.MathUtils.lerp(
              this.el.object3D.position.y,
              targetY,
              0.32
            );
        } else {
          this.el.object3D.position.x =
            THREE.MathUtils.lerp(
              this.el.object3D.position.x,
              this.baseX,
              0.14
            );

          this.el.object3D.position.y =
            THREE.MathUtils.lerp(
              this.el.object3D.position.y,
              this.baseY,
              0.14
            );
        }

        this.previousRigPosition.copy(
          this.currentRigPosition
        );
      }
    });


    /* ============================================================
       5. QUEST-FRIENDLY PLAYER COLLISION
    ============================================================ */
    AFRAME.registerComponent('quest-room-collider', {
      schema: {
        objects: {
          default: '[gltf-model]'
        },

        radius: {
          default: 0.32
        },

        skin: {
          default: 0.035
        },

        maxSubstep: {
          default: 0.12
        },

        teleportDistance: {
          default: 0.75
        }
      },

      init: function () {
        this.colliderMeshes = [];

        this.lastPosition =
          this.el.object3D.position.clone();

        this.raycaster =
          new THREE.Raycaster();

        this.from =
          new THREE.Vector3();

        this.to =
          new THREE.Vector3();

        this.delta =
          new THREE.Vector3();

        this.direction =
          new THREE.Vector3();

        this.side =
          new THREE.Vector3();

        this.origin =
          new THREE.Vector3();

        this.safePosition =
          new THREE.Vector3();

        this.step =
          new THREE.Vector3();

        this.testPosition =
          new THREE.Vector3();

        this.refreshColliders =
          this.refreshColliders.bind(this);

        this.el.sceneEl.addEventListener(
          'loaded',
          this.refreshColliders
        );

        this.el.sceneEl.addEventListener(
          'enter-vr',
          () => this.resetPosition()
        );

        this.el.sceneEl.addEventListener(
          'exit-vr',
          () => this.resetPosition()
        );

        this.el.sceneEl
          .querySelectorAll(this.data.objects)
          .forEach((entity) => {
            entity.addEventListener(
              'model-loaded',
              this.refreshColliders
            );
          });

        window.setTimeout(
          this.refreshColliders,
          1000
        );
      },

      resetPosition: function () {
        this.lastPosition.copy(
          this.el.object3D.position
        );
      },

      refreshColliders: function () {
        const meshes = [];

        this.el.sceneEl
          .querySelectorAll(this.data.objects)
          .forEach((entity) => {
            const root =
              entity.getObject3D('mesh');

            if (!root) {
              return;
            }

            root.traverse((node) => {
              if (
                node.isMesh &&
                node.geometry &&
                node.visible
              ) {
                node.userData.collisionEntity =
                  entity;

                meshes.push(node);
              }
            });
          });

        this.colliderMeshes = meshes;

        console.log(
          `Player collision loaded ${meshes.length} mesh collider(s).`
        );
      },

      isBlocked: function (from, to) {
        if (!this.colliderMeshes.length) {
          return false;
        }

        this.delta.subVectors(
          to,
          from
        );

        this.delta.y = 0;

        const distance =
          this.delta.length();

        if (distance < 0.0001) {
          return false;
        }

        this.direction
          .copy(this.delta)
          .normalize();

        this.side.set(
          -this.direction.z,
          0,
          this.direction.x
        );

        const heights = [
          0.22,
          0.85,
          1.42
        ];

        const sideOffsets = [
          -this.data.radius * 0.72,
          0,
          this.data.radius * 0.72
        ];

        const rayLength =
          distance +
          this.data.radius +
          this.data.skin;

        for (
          let heightIndex = 0;
          heightIndex < heights.length;
          heightIndex++
        ) {
          for (
            let sideIndex = 0;
            sideIndex < sideOffsets.length;
            sideIndex++
          ) {
            this.origin
              .copy(from)
              .addScaledVector(
                this.side,
                sideOffsets[sideIndex]
              );

            this.origin.y +=
              heights[heightIndex];

            this.origin.addScaledVector(
              this.direction,
              0.004
            );

            this.raycaster.set(
              this.origin,
              this.direction
            );

            this.raycaster.near = 0;
            this.raycaster.far = rayLength;

            const hits =
              this.raycaster.intersectObjects(
                this.colliderMeshes,
                false
              );

            const blockingHit =
              hits.find((hit) => {
                const owner =
                  hit.object &&
                  hit.object.userData
                    ? hit.object.userData.collisionEntity
                    : null;

                if (
                  owner &&
                  owner.is &&
                  owner.is('grabbed')
                ) {
                  return false;
                }

                return (
                  hit.distance <= rayLength
                );
              });

            if (blockingHit) {
              return true;
            }
          }
        }

        return false;
      },

      moveWithSliding: function (
        start,
        desired
      ) {
        this.delta.subVectors(
          desired,
          start
        );

        this.delta.y = 0;

        const distance =
          this.delta.length();

        if (distance < 0.0001) {
          this.safePosition.copy(desired);
          return this.safePosition;
        }

        const steps =
          Math.max(
            1,
            Math.ceil(
              distance /
              this.data.maxSubstep
            )
          );

        this.step
          .copy(this.delta)
          .divideScalar(steps);

        this.safePosition.copy(start);

        for (
          let index = 0;
          index < steps;
          index++
        ) {
          this.testPosition
            .copy(this.safePosition)
            .add(this.step);

          if (
            !this.isBlocked(
              this.safePosition,
              this.testPosition
            )
          ) {
            this.safePosition.copy(
              this.testPosition
            );

            continue;
          }

          if (
            Math.abs(this.step.x) >
            0.0001
          ) {
            this.testPosition.copy(
              this.safePosition
            );

            this.testPosition.x +=
              this.step.x;

            if (
              !this.isBlocked(
                this.safePosition,
                this.testPosition
              )
            ) {
              this.safePosition.x =
                this.testPosition.x;
            }
          }

          if (
            Math.abs(this.step.z) >
            0.0001
          ) {
            this.testPosition.copy(
              this.safePosition
            );

            this.testPosition.z +=
              this.step.z;

            if (
              !this.isBlocked(
                this.safePosition,
                this.testPosition
              )
            ) {
              this.safePosition.z =
                this.testPosition.z;
            }
          }
        }

        this.safePosition.y =
          desired.y;

        return this.safePosition;
      },

      tick: function () {
        const current =
          this.el.object3D.position;

        this.from.copy(
          this.lastPosition
        );

        this.to.copy(current);

        const horizontalDistance =
          Math.hypot(
            this.to.x - this.from.x,
            this.to.z - this.from.z
          );

        if (
          horizontalDistance >
          this.data.teleportDistance
        ) {
          this.lastPosition.copy(
            current
          );

          return;
        }

        if (
          horizontalDistance <
          0.0001
        ) {
          this.lastPosition.y =
            current.y;

          return;
        }

        const corrected =
          this.moveWithSliding(
            this.from,
            this.to
          );

        current.x = corrected.x;
        current.z = corrected.z;

        this.lastPosition.set(
          corrected.x,
          current.y,
          corrected.z
        );
      }
    });


    /* ============================================================
       6. DOOR OPEN / CLOSE
    ============================================================ */
    AFRAME.registerComponent('door-hinge', {
      schema: {
        openAngle: {
          default: 100
        },

        hingeSide: {
          default: 'left',
          oneOf: ['left', 'right']
        },

        direction: {
          default: 1
        },

        duration: {
          default: 650
        },

        /*
          Automatically attempts to separate a two-leaf door model
          into independent left and right doors.
        */
        splitDoubleDoor: {
          default: true
        }
      },

      init: function () {
        this.root = null;
        this.container = null;
        this.parts = [];
        this.partStates = new Map();
        this.lastActivation = 0;
        this.lastActiveState = null;
        this.modelBox = null;
        this.widthAxis = 'x';
        this.closeTarget = null;

        this.el.addEventListener(
          'model-loaded',
          () => {
            this.prepareDoorParts();
            this.createCloseTarget();
          }
        );

        this.el.addEventListener(
          'activate-object',
          (event) => {
            const hitObject =
              event.detail &&
              event.detail.object
                ? event.detail.object
                : null;

            this.activatePart(hitObject);
          }
        );

        /*
          Mac mouse click support. Hovering alone does nothing.
        */
        this.el.addEventListener(
          'click',
          (event) => {
            /*
              A-Frame also uses "vr-mode" for desktop fullscreen.
              Blocking every vr-mode click made Mac users able to
              open a door before fullscreen but unable to close it
              after entering fullscreen.

              Ignore this mouse handler only during a real immersive
              headset session. Mac fullscreen remains interactive.
            */
            const scene =
              this.el.sceneEl;

            const isRealHeadsetSession =
              Boolean(
                scene &&
                scene.renderer &&
                scene.renderer.xr &&
                scene.renderer.xr.isPresenting
              );

            if (isRealHeadsetSession) {
              return;
            }

            if (
              event &&
              event.stopPropagation
            ) {
              event.stopPropagation();
            }

            const hitObject =
              event &&
              event.detail &&
              event.detail.intersection
                ? event.detail.intersection.object
                : null;

            if (!hitObject) {
              return;
            }

            if (
              this.activatePart(
                hitObject
              )
            ) {
              return;
            }

            /*
              Some GLB frame or handle meshes are not one of the
              detected moving leaves. When the visible door entity
              was genuinely clicked, close an open leaf rather than
              doing nothing.
            */
            this.closeOpenDoor();
          }
        );
      },

      hasMeshDescendant: function (object) {
        let found = false;

        object.traverse((node) => {
          if (node.isMesh) {
            found = true;
          }
        });

        return found;
      },

      getLocalBoundingBox: function (part) {
        const box =
          new THREE.Box3();

        box.makeEmpty();

        this.el.object3D.updateMatrixWorld(
          true
        );

        part.updateMatrixWorld(true);

        const inverseEntityWorld =
          new THREE.Matrix4()
            .copy(
              this.el.object3D.matrixWorld
            )
            .invert();

        part.traverse((node) => {
          if (
            !node.isMesh ||
            !node.geometry
          ) {
            return;
          }

          if (!node.geometry.boundingBox) {
            node.geometry.computeBoundingBox();
          }

          if (!node.geometry.boundingBox) {
            return;
          }

          const nodeToEntity =
            new THREE.Matrix4()
              .multiplyMatrices(
                inverseEntityWorld,
                node.matrixWorld
              );

          const nodeBox =
            node.geometry.boundingBox
              .clone()
              .applyMatrix4(
                nodeToEntity
              );

          box.union(nodeBox);
        });

        return box;
      },

      getMeshLocalBox: function (mesh) {
        if (
          !mesh.geometry ||
          !mesh.geometry.boundingBox
        ) {
          if (mesh.geometry) {
            mesh.geometry.computeBoundingBox();
          }
        }

        if (
          !mesh.geometry ||
          !mesh.geometry.boundingBox
        ) {
          return null;
        }

        this.el.object3D.updateMatrixWorld(
          true
        );

        mesh.updateMatrixWorld(true);

        const inverseEntityWorld =
          new THREE.Matrix4()
            .copy(
              this.el.object3D.matrixWorld
            )
            .invert();

        const meshToEntity =
          new THREE.Matrix4()
            .multiplyMatrices(
              inverseEntityWorld,
              mesh.matrixWorld
            );

        return mesh.geometry.boundingBox
          .clone()
          .applyMatrix4(
            meshToEntity
          );
      },

      buildDoubleDoorParts: function () {
        if (
          !this.data.splitDoubleDoor ||
          !this.container ||
          !this.modelBox
        ) {
          return false;
        }

        const modelSize =
          new THREE.Vector3();

        const modelCenter =
          new THREE.Vector3();

        this.modelBox.getSize(
          modelSize
        );

        this.modelBox.getCenter(
          modelCenter
        );

        this.widthAxis =
          modelSize.x >= modelSize.z
            ? 'x'
            : 'z';

        const horizontalSize =
          this.widthAxis === 'x'
            ? modelSize.x
            : modelSize.z;

        const horizontalCenter =
          this.widthAxis === 'x'
            ? modelCenter.x
            : modelCenter.z;

        if (horizontalSize <= 0.001) {
          return false;
        }

        const meshes = [];

        this.container.traverse((node) => {
          if (
            node.isMesh &&
            node.geometry &&
            node.visible
          ) {
            const box =
              this.getMeshLocalBox(node);

            if (!box || box.isEmpty()) {
              return;
            }

            const size =
              new THREE.Vector3();

            const center =
              new THREE.Vector3();

            box.getSize(size);
            box.getCenter(center);

            const horizontalCenterValue =
              this.widthAxis === 'x'
                ? center.x
                : center.z;

            const horizontalExtent =
              this.widthAxis === 'x'
                ? size.x
                : size.z;

            /*
              Ignore a single huge backing/frame mesh. Keep central
              panels and their nearby details.
            */
            const coversAlmostEverything =
              horizontalExtent >
                horizontalSize * 0.88 &&
              size.y >
                modelSize.y * 0.82;

            const insideCentralBand =
              Math.abs(
                horizontalCenterValue -
                horizontalCenter
              ) <
              horizontalSize * 0.43;

            if (
              !coversAlmostEverything &&
              insideCentralBand
            ) {
              meshes.push({
                mesh: node,
                box,
                size,
                center,
                horizontalCenter:
                  horizontalCenterValue
              });
            }
          }
        });

        if (meshes.length < 2) {
          return false;
        }

        const leftMeshes =
          meshes.filter(
            entry =>
              entry.horizontalCenter <
              horizontalCenter
          );

        const rightMeshes =
          meshes.filter(
            entry =>
              entry.horizontalCenter >=
              horizontalCenter
          );

        if (
          !leftMeshes.length ||
          !rightMeshes.length
        ) {
          return false;
        }

        const leftBox =
          new THREE.Box3();

        const rightBox =
          new THREE.Box3();

        leftBox.makeEmpty();
        rightBox.makeEmpty();

        leftMeshes.forEach(
          entry =>
            leftBox.union(entry.box)
        );

        rightMeshes.forEach(
          entry =>
            rightBox.union(entry.box)
        );

        const leftSize =
          new THREE.Vector3();

        const rightSize =
          new THREE.Vector3();

        leftBox.getSize(leftSize);
        rightBox.getSize(rightSize);

        const leftHorizontal =
          this.widthAxis === 'x'
            ? leftSize.x
            : leftSize.z;

        const rightHorizontal =
          this.widthAxis === 'x'
            ? rightSize.x
            : rightSize.z;

        /*
          Both groups must resemble meaningful door leaves.
        */
        if (
          leftSize.y <
            modelSize.y * 0.32 ||
          rightSize.y <
            modelSize.y * 0.32 ||
          leftHorizontal <
            horizontalSize * 0.08 ||
          rightHorizontal <
            horizontalSize * 0.08
        ) {
          return false;
        }

        const leftGroup =
          new THREE.Group();

        const rightGroup =
          new THREE.Group();

        leftGroup.name =
          'auto-left-door-leaf';

        rightGroup.name =
          'auto-right-door-leaf';

        this.el.object3D.add(
          leftGroup
        );

        this.el.object3D.add(
          rightGroup
        );

        /*
          attach() preserves each mesh's exact world transform.
        */
        leftMeshes.forEach(
          entry =>
            leftGroup.attach(
              entry.mesh
            )
        );

        rightMeshes.forEach(
          entry =>
            rightGroup.attach(
              entry.mesh
            )
        );

        leftGroup.userData.autoDoorSide =
          'left';

        rightGroup.userData.autoDoorSide =
          'right';

        this.parts = [
          leftGroup,
          rightGroup
        ];

        console.log(
          'Double door detected: left and right leaves are independently selectable.'
        );

        return true;
      },

      prepareDoorParts: function () {
        this.root =
          this.el.getObject3D('mesh');

        if (!this.root) {
          return;
        }

        let container =
          this.root;

        while (true) {
          const meaningfulChildren =
            container.children.filter(
              child =>
                this.hasMeshDescendant(
                  child
                )
            );

          if (
            meaningfulChildren.length !== 1 ||
            meaningfulChildren[0].isMesh
          ) {
            break;
          }

          container =
            meaningfulChildren[0];
        }

        this.container =
          container;

        this.modelBox =
          this.getLocalBoundingBox(
            container
          );

        if (
          this.buildDoubleDoorParts()
        ) {
          return;
        }

        this.parts =
          container.children.filter(
            child =>
              this.hasMeshDescendant(
                child
              )
          );

        if (!this.parts.length) {
          this.parts = [container];
        }

        console.log(
          `Door model contains ${this.parts.length} selectable part(s).`
        );
      },

      createCloseTarget: function () {
        if (
          this.closeTarget ||
          !this.root
        ) {
          return;
        }

        this.root.updateMatrixWorld(
          true
        );

        const box =
          new THREE.Box3()
            .setFromObject(
              this.root
            );

        if (box.isEmpty()) {
          return;
        }

        const size =
          new THREE.Vector3();

        const center =
          new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const target =
          document.createElement('a-box');

        target.setAttribute(
          'id',
          'doorCloseTarget'
        );

        target.setAttribute(
          'position',
          `${center.x} ${center.y} ${center.z}`
        );

        /*
          This target occupies only a small central section of the
          original doorway. It exists solely to close an already-open
          door after the visible panel has swung out of the centre.
        */
        target.setAttribute(
          'width',
          Math.max(
            size.x * 0.28,
            0.18
          )
        );

        target.setAttribute(
          'height',
          Math.max(
            size.y * 0.30,
            0.42
          )
        );

        target.setAttribute(
          'depth',
          Math.max(
            size.z * 0.28,
            0.12
          )
        );

        target.setAttribute(
          'material',
          'opacity: 0; transparent: true; depthWrite: false; side: double'
        );

        target.setAttribute(
          'visible',
          false
        );

        target.addEventListener(
          'click',
          (event) => {
            const scene =
              this.el.sceneEl;

            const isRealHeadsetSession =
              Boolean(
                scene &&
                scene.renderer &&
                scene.renderer.xr &&
                scene.renderer.xr.isPresenting
              );

            if (isRealHeadsetSession) {
              return;
            }

            if (
              event &&
              event.stopPropagation
            ) {
              event.stopPropagation();
            }

            /*
              Important: this can only close. It never opens.
            */
            this.closeOpenDoor();
          }
        );

        this.el.sceneEl.appendChild(
          target
        );

        this.closeTarget =
          target;

        this.updateCloseTarget();
      },

      getOpenState: function () {
        if (
          this.lastActiveState &&
          this.lastActiveState.isOpen
        ) {
          return this.lastActiveState;
        }

        let openState = null;

        this.partStates.forEach(
          (state) => {
            if (
              !openState &&
              state.isOpen
            ) {
              openState = state;
            }
          }
        );

        return openState;
      },

      closeOpenDoor: function () {
        const state =
          this.getOpenState();

        if (!state) {
          return false;
        }

        const now =
          performance.now();

        if (
          now -
          this.lastActivation <
          250
        ) {
          return false;
        }

        this.lastActivation =
          now;

        this.lastActiveState =
          state;

        this.startDoorAnimation(
          state,
          false
        );

        return true;
      },

      updateCloseTarget: function () {
        if (!this.closeTarget) {
          return;
        }

        const hasOpenDoor =
          Boolean(
            this.getOpenState()
          );

        this.closeTarget.setAttribute(
          'visible',
          hasOpenDoor
        );
      },


      findPartFromHit: function (
        hitObject
      ) {
        let current =
          hitObject;

        while (current) {
          if (
            current.userData &&
            current.userData.doorPartState
          ) {
            return current.userData
              .doorPartState.part;
          }

          if (
            this.parts.includes(current)
          ) {
            return current;
          }

          if (current === this.root) {
            break;
          }

          current =
            current.parent;
        }

        return this.parts.length === 1
          ? this.parts[0]
          : null;
      },

      createState: function (part) {
        if (
          this.partStates.has(part)
        ) {
          return this.partStates.get(
            part
          );
        }

        const box =
          this.getLocalBoundingBox(
            part
          );

        if (box.isEmpty()) {
          return null;
        }

        const size =
          new THREE.Vector3();

        const center =
          new THREE.Vector3();

        box.getSize(size);
        box.getCenter(center);

        const widthRunsAlongX =
          size.x >= size.z;

        const side =
          part.userData.autoDoorSide ||
          this.data.hingeSide;

        const hingePosition =
          center.clone();

        if (widthRunsAlongX) {
          hingePosition.x =
            side === 'left'
              ? box.min.x
              : box.max.x;
        } else {
          hingePosition.z =
            side === 'left'
              ? box.min.z
              : box.max.z;
        }

        const pivot =
          new THREE.Group();

        pivot.name =
          `individual-door-hinge-${side}`;

        pivot.position.copy(
          hingePosition
        );

        this.el.object3D.add(
          pivot
        );

        pivot.attach(part);

        /*
          The right leaf opens in the opposite direction from
          the left leaf. A normal single door keeps the configured
          direction.
        */
        const automaticDirection =
          part.userData.autoDoorSide ===
          'right'
            ? -Math.abs(
                this.data.direction
              )
            : part.userData.autoDoorSide ===
              'left'
              ? Math.abs(
                  this.data.direction
                )
              : this.data.direction;

        const state = {
          part,
          pivot,
          direction:
            automaticDirection,
          isOpen: false,
          currentAngle: 0,
          startAngle: 0,
          targetAngle: 0,
          animationTime: 0,
          isAnimating: false
        };

        part.userData.doorPartState =
          state;

        this.partStates.set(
          part,
          state
        );

        return state;
      },

      startDoorAnimation: function (
        state,
        shouldOpen
      ) {
        state.isOpen =
          shouldOpen;

        this.updateCloseTarget();

        state.startAngle =
          state.currentAngle;

        const targetDegrees =
          shouldOpen
            ? this.data.openAngle *
              state.direction
            : 0;

        state.targetAngle =
          THREE.MathUtils.degToRad(
            targetDegrees
          );

        state.animationTime = 0;
        state.isAnimating = true;
      },

      activatePart: function (
        hitObject
      ) {
        const now =
          performance.now();

        if (
          now - this.lastActivation <
          250
        ) {
          return false;
        }

        const part =
          this.findPartFromHit(
            hitObject
          );

        if (!part) {
          return false;
        }

        const state =
          this.createState(part);

        if (!state) {
          return false;
        }

        this.lastActivation =
          now;

        this.lastActiveState =
          state;

        this.startDoorAnimation(
          state,
          !state.isOpen
        );

        return true;
      },

      toggleLastDoor: function () {
        const state =
          this.lastActiveState;

        if (!state) {
          return false;
        }

        const now =
          performance.now();

        if (
          now - this.lastActivation <
          250
        ) {
          return false;
        }

        this.lastActivation =
          now;

        this.startDoorAnimation(
          state,
          !state.isOpen
        );

        return true;
      },

      easeInOut: function (value) {
        return value < 0.5
          ? 2 * value * value
          : 1 -
            Math.pow(
              -2 * value + 2,
              2
            ) / 2;
      },

      tick: function (
        time,
        deltaTime
      ) {
        if (!deltaTime) {
          return;
        }

        this.partStates.forEach(
          (state) => {
            if (!state.isAnimating) {
              return;
            }

            state.animationTime +=
              deltaTime;

            const progress =
              Math.min(
                state.animationTime /
                this.data.duration,
                1
              );

            const eased =
              this.easeInOut(
                progress
              );

            state.currentAngle =
              THREE.MathUtils.lerp(
                state.startAngle,
                state.targetAngle,
                eased
              );

            state.pivot.rotation.y =
              state.currentAngle;

            if (progress >= 1) {
              state.currentAngle =
                state.targetAngle;

              state.pivot.rotation.y =
                state.targetAngle;

              state.isAnimating =
                false;
            }
          }
        );
      }
    });


    /* ============================================================
       6b. NATURAL GRABBABLE (proximity-based, VR game style)

       Desktop: click to pick up, click again to drop.
       VR: move the hand near the item and hold grip.
    ============================================================ */
    AFRAME.registerComponent('natural-grabbable', {
      schema: {
        gravity: { default: -9.8 },
        floorY: { default: 0.015 },
        throwMultiplier: { default: 1.0 },
        maxThrowSpeed: { default: 6 }
      },

      init: function () {
        this.heldBy = null;
        this.velocity = new THREE.Vector3();
        this.isMoving = false;
        this.lastSurfaceCheck = 0;

        this.dropRay = new THREE.Raycaster();
        this.dropRay.far = 2.5;

        this.cachedRoomMeshes = [];
        this.roomMeshCacheTime = 0;

        this.el.addEventListener('click', () => {
          if (this.el.sceneEl.is('vr-mode')) {
            return;
          }

          const desktopHold =
            document.querySelector('#desktopHold');

          if (!desktopHold) {
            return;
          }

          if (this.heldBy) {
            this.release(
              new THREE.Vector3()
            );
          } else {
            this.grab(desktopHold);
          }
        });
      },

      getWorldBox: function () {
        const model =
          this.el.getObject3D('mesh') ||
          this.el.object3D;

        model.updateMatrixWorld(true);

        return new THREE.Box3().setFromObject(
          model
        );
      },

      distanceToPoint: function (worldPoint) {
        const box = this.getWorldBox();

        if (box.isEmpty()) {
          return Infinity;
        }

        const closest =
          worldPoint.clone().clamp(
            box.min,
            box.max
          );

        return closest.distanceTo(
          worldPoint
        );
      },

      reparentPreserveWorld: function (newParentObject3D) {
        /*
          Direct THREE.js reparenting only — no DOM appendChild.
          Object3D.attach() computes and preserves the object's
          exact world transform automatically when moving it under
          a new parent, so the item never jumps, and it reliably
          starts following its new parent (hand or scene root)
          every frame from then on.
        */
        newParentObject3D.updateMatrixWorld(true);
        newParentObject3D.attach(this.el.object3D);
      },

      grab: function (handEntity) {
        if (this.heldBy) {
          return false;
        }

        this.isMoving = false;
        this.velocity.set(0, 0, 0);
        this.heldBy = handEntity;

        this.reparentPreserveWorld(
          handEntity.object3D
        );

        this.el.addState('grabbed');

        console.log(
          this.el.id,
          'grabbed by',
          handEntity.id
        );

        return true;
      },

      release: function (controllerVelocity) {
        if (!this.heldBy) {
          return;
        }

        const scene =
          this.el.sceneEl;

        this.reparentPreserveWorld(scene.object3D);

        this.heldBy = null;
        this.el.removeState('grabbed');

        this.velocity.copy(
          controllerVelocity ||
          new THREE.Vector3()
        );

        this.velocity.multiplyScalar(
          this.data.throwMultiplier
        );

        this.velocity.clampLength(
          0,
          this.data.maxThrowSpeed
        );

        if (this.velocity.length() < 0.22) {
          const settled =
            this.settleOnNearbySurface(0.45);

          this.isMoving = !settled;
        } else {
          this.isMoving = true;
        }

        console.log(
          this.el.id,
          'released at speed',
          this.velocity.length().toFixed(2)
        );
      },

      getRoomMeshes: function () {
        const now = performance.now();

        if (
          this.cachedRoomMeshes.length &&
          now - this.roomMeshCacheTime < 5000
        ) {
          return this.cachedRoomMeshes;
        }

        const meshes = [];

        this.el.sceneEl
          .querySelectorAll('.roompart')
          .forEach((entity) => {
            const root =
              entity.getObject3D('mesh');

            if (!root) {
              return;
            }

            root.updateMatrixWorld(true);

            root.traverse((node) => {
              if (node.isMesh) {
                meshes.push(node);
              }
            });
          });

        this.cachedRoomMeshes = meshes;
        this.roomMeshCacheTime = now;

        return this.cachedRoomMeshes;
      },

      settleOnNearbySurface: function (maximumDistance) {
        const roomMeshes =
          this.getRoomMeshes();

        if (!roomMeshes.length) {
          return false;
        }

        const box =
          this.getWorldBox();

        if (box.isEmpty()) {
          return false;
        }

        const center =
          new THREE.Vector3();

        box.getCenter(center);

        const origin =
          new THREE.Vector3(
            center.x,
            box.min.y + 0.08,
            center.z
          );

        this.dropRay.set(
          origin,
          new THREE.Vector3(0, -1, 0)
        );

        this.dropRay.far =
          maximumDistance + 0.08;

        const hit =
          this.dropRay.intersectObjects(
            roomMeshes,
            true
          )[0];

        if (!hit) {
          return false;
        }

        const gap =
          box.min.y - hit.point.y;

        if (
          gap < -0.03 ||
          gap > maximumDistance
        ) {
          return false;
        }

        this.el.object3D.position.y +=
          hit.point.y -
          box.min.y +
          0.012;

        this.velocity.set(0, 0, 0);
        return true;
      },

      tick: function (time, deltaTime) {
        if (
          this.heldBy ||
          !this.isMoving ||
          !deltaTime
        ) {
          return;
        }

        const dt =
          Math.min(
            deltaTime / 1000,
            0.04
          );

        this.velocity.y +=
          this.data.gravity * dt;

        this.el.object3D.position.addScaledVector(
          this.velocity,
          dt
        );

        const damping =
          Math.pow(0.985, dt * 60);

        this.velocity.x *= damping;
        this.velocity.z *= damping;

        this.el.object3D.updateMatrixWorld(true);

        const box =
          this.getWorldBox();

        if (!box.isEmpty()) {
          const floorPenetration =
            this.data.floorY -
            box.min.y;

          if (floorPenetration > 0) {
            this.el.object3D.position.y +=
              floorPenetration;

            if (
              Math.abs(this.velocity.y) >
              0.8
            ) {
              this.velocity.y *= -0.12;
              this.velocity.x *= 0.72;
              this.velocity.z *= 0.72;
            } else {
              this.velocity.set(0, 0, 0);
              this.isMoving = false;
            }
          }
        }

        if (
          this.isMoving &&
          this.velocity.y <= 0 &&
          time - this.lastSurfaceCheck > 120
        ) {
          this.lastSurfaceCheck = time;

          if (
            this.settleOnNearbySurface(0.12)
          ) {
            this.isMoving = false;
          }
        }
      }
    });


    /* ============================================================
       NATURAL VR HAND GRAB
    ============================================================ */
    AFRAME.registerComponent('natural-grab-hand', {
      schema: {
        radius: { default: 0.4 },
        velocitySmoothing: { default: 0.35 },
        gripThreshold: { default: 0.5 }
      },

      init: function () {
        this.heldItem = null;

        this.previousPosition =
          new THREE.Vector3();

        this.currentPosition =
          new THREE.Vector3();

        this.smoothedVelocity =
          new THREE.Vector3();

        this.instantVelocity =
          new THREE.Vector3();

        this.hasPreviousPosition = false;
        this.lastHudUpdate = 0;
        this.gripHeld = false;
        this.analogGripHeld = false;

        this.beginGrip =
          this.beginGrip.bind(this);

        this.endGrip =
          this.endGrip.bind(this);

        this.onGripChanged =
          this.onGripChanged.bind(this);

        this.el.addEventListener(
          'gripdown',
          this.beginGrip
        );

        this.el.addEventListener(
          'squeezestart',
          this.beginGrip
        );

        this.el.addEventListener(
          'gripup',
          this.endGrip
        );

        this.el.addEventListener(
          'squeezeend',
          this.endGrip
        );

        this.el.addEventListener(
          'gripchanged',
          this.onGripChanged
        );

        this.el.addEventListener(
          'abuttondown',
          this.beginGrip
        );

        this.el.addEventListener(
          'abuttonup',
          this.endGrip
        );

        this.el.addEventListener(
          'xbuttondown',
          this.beginGrip
        );

        this.el.addEventListener(
          'xbuttonup',
          this.endGrip
        );

        this.el.addEventListener(
          'controllerdisconnected',
          this.endGrip
        );
      },

      onGripChanged: function (event) {
        const value =
          event && event.detail &&
          typeof event.detail.value === 'number'
            ? event.detail.value
            : (event && typeof event.detail === 'number'
                ? event.detail
                : null);

        if (value === null) {
          return;
        }

        const isPressed =
          value >= this.data.gripThreshold;

        if (isPressed && !this.analogGripHeld) {
          this.analogGripHeld = true;
          this.beginGrip();
        } else if (!isPressed && this.analogGripHeld) {
          this.analogGripHeld = false;
          this.endGrip();
        }
      },

      beginGrip: function () {
        if (this.gripHeld) {
          return;
        }

        this.gripHeld = true;
        this.grabNearest();
      },

      endGrip: function () {
        if (!this.gripHeld && !this.heldItem) {
          return;
        }

        this.gripHeld = false;
        this.releaseHeld();
      },

      findNearest: function () {
        const handPosition =
          new THREE.Vector3();

        this.el.object3D.getWorldPosition(
          handPosition
        );

        let nearest = null;
        let nearestEl = null;
        let nearestDistance = Infinity;

        this.el.sceneEl
          .querySelectorAll(
            '[natural-grabbable]'
          )
          .forEach((entity) => {
            const component =
              entity.components[
                'natural-grabbable'
              ];

            if (
              !component ||
              component.heldBy
            ) {
              return;
            }

            const distance =
              component.distanceToPoint(
                handPosition
              );

            if (distance < nearestDistance) {
              nearest = component;
              nearestEl = entity;
              nearestDistance = distance;
            }
          });

        return { nearest, nearestEl, nearestDistance };
      },

      grabNearest: function () {
        if (this.heldItem) {
          return;
        }

        const { nearest, nearestEl, nearestDistance } =
          this.findNearest();

        if (!nearest || nearestDistance > this.data.radius) {
          console.log(
            this.el.id,
            'grip pressed, but no item was close enough. Nearest was',
            nearestEl ? nearestEl.id : 'none',
            'at',
            isFinite(nearestDistance) ? nearestDistance.toFixed(2) + 'm' : 'n/a'
          );

          if (window.updateDebugHud) {
            window.updateDebugHud(
              'Grip pressed, out of range. Nearest: ' +
              (nearestEl ? nearestEl.id : 'none') +
              ' at ' +
              (isFinite(nearestDistance) ? nearestDistance.toFixed(2) + 'm' : 'n/a') +
              ' (need <= ' + this.data.radius + 'm)'
            );
          }

          return;
        }

        if (nearest.grab(this.el)) {
          this.heldItem = nearest;

          if (window.updateDebugHud) {
            window.updateDebugHud(
              'Grabbed: ' + (nearestEl ? nearestEl.id : 'item')
            );
          }
        }
      },

      releaseHeld: function () {
        if (!this.heldItem) {
          return;
        }

        const released =
          this.heldItem;

        this.heldItem = null;

        released.release(
          this.smoothedVelocity.clone()
        );

        if (window.updateDebugHud) {
          window.updateDebugHud('Released item.');
        }
      },

      tick: function (time, deltaTime) {
        if (!deltaTime) {
          return;
        }

        this.el.object3D.getWorldPosition(
          this.currentPosition
        );

        if (!this.hasPreviousPosition) {
          this.previousPosition.copy(
            this.currentPosition
          );

          this.hasPreviousPosition = true;
          return;
        }

        const seconds =
          deltaTime / 1000;

        if (seconds > 0) {
          this.instantVelocity
            .subVectors(
              this.currentPosition,
              this.previousPosition
            )
            .divideScalar(seconds);

          this.smoothedVelocity.lerp(
            this.instantVelocity,
            this.data.velocitySmoothing
          );

          this.previousPosition.copy(
            this.currentPosition
          );
        }

        if (!this.heldItem && time - this.lastHudUpdate > 150) {
          this.lastHudUpdate = time;

          const { nearestEl, nearestDistance } =
            this.findNearest();

          if (window.updateDebugHud) {
            if (nearestEl) {
              const inRange = nearestDistance <= this.data.radius;
              window.updateDebugHud(
                (inRange ? '[IN RANGE] ' : '') +
                'Nearest to ' + this.el.id + ': ' + nearestEl.id +
                ' @ ' + nearestDistance.toFixed(2) + 'm (grip range ' +
                this.data.radius + 'm)'
              );
            } else {
              window.updateDebugHud('No grabbable items found in scene.');
            }
          }
        }
      }
    });


    /* ============================================================
       RIGHT TRIGGER: DOOR ONLY
    ============================================================ */
    AFRAME.registerComponent('vr-door-interactor', {
      schema: {
        pressThreshold: {
          default: 0.65
        },

        releaseThreshold: {
          default: 0.2
        }
      },

      init: function () {
        this.triggerHeld = false;
        this.lastTriggerTime = 0;

        this.pressTrigger =
          this.pressTrigger.bind(this);

        this.releaseTrigger =
          this.releaseTrigger.bind(this);

        this.onTriggerChanged =
          this.onTriggerChanged.bind(this);

        /*
          Only real trigger input is used.
          Merely hovering the laser over the door cannot activate it.
        */
        this.el.addEventListener(
          'triggerdown',
          this.pressTrigger
        );

        this.el.addEventListener(
          'triggerup',
          this.releaseTrigger
        );

        this.el.addEventListener(
          'triggerchanged',
          this.onTriggerChanged
        );

        this.el.addEventListener(
          'controllerdisconnected',
          this.releaseTrigger
        );
      },

      pressTrigger: function (event) {
        if (this.triggerHeld) {
          return;
        }

        if (
          event &&
          event.stopPropagation
        ) {
          event.stopPropagation();
        }

        const now =
          performance.now();

        if (
          now - this.lastTriggerTime <
          250
        ) {
          return;
        }

        this.triggerHeld = true;
        this.lastTriggerTime = now;

        this.useDoor();
      },

      releaseTrigger: function () {
        this.triggerHeld = false;
      },

      onTriggerChanged: function (event) {
        const value =
          event &&
          event.detail &&
          typeof event.detail.value === 'number'
            ? event.detail.value
            : null;

        if (value === null) {
          return;
        }

        if (
          value >= this.data.pressThreshold &&
          !this.triggerHeld
        ) {
          this.pressTrigger();
        } else if (
          value <= this.data.releaseThreshold
        ) {
          this.releaseTrigger();
        }
      },

      useDoor: function () {
        const raycaster =
          this.el.components.raycaster;

        const exitButton =
          document.querySelector(
            '#exitVRButton'
          );

        const door =
          document.querySelector('#door');

        const closeTarget =
          document.querySelector(
            '#doorCloseTarget'
          );

        if (!raycaster || !door) {
          return;
        }

        if (raycaster.refreshObjects) {
          raycaster.refreshObjects();
        }

        /*
          EXIT VR takes priority, but only when its small visible
          button is actually hit by the controller ray.
        */
        const exitIntersection =
          exitButton &&
          raycaster.getIntersection
            ? raycaster.getIntersection(
                exitButton
              )
            : null;

        if (exitIntersection) {
          const exitComponent =
            exitButton.components[
              'exit-experience'
            ];

          if (exitComponent) {
            exitComponent.exitExperience();
          }

          return;
        }

        const doorComponent =
          door.components['door-hinge'];

        if (!doorComponent) {
          return;
        }

        const closeIntersection =
          closeTarget &&
          raycaster.getIntersection
            ? raycaster.getIntersection(
                closeTarget
              )
            : null;

        if (closeIntersection) {
          doorComponent.closeOpenDoor();
          return;
        }

        const doorIntersection =
          raycaster.getIntersection
            ? raycaster.getIntersection(door)
            : null;

        /*
          No visible-door or active close-target hit means no action.
        */
        if (!doorIntersection) {
          return;
        }

        /*
          Use the exact panel that was pointed at.
        */
        if (
          doorComponent.activatePart(
            doorIntersection.object
          )
        ) {
          return;
        }

        /*
          This fallback is allowed only after the visible door itself
          was hit, preserving repeated open/close behavior.
        */
        doorComponent.toggleLastDoor();
      }
    });


    /* ============================================================
       9. FOOTSTEPS
    ============================================================ */
    AFRAME.registerComponent('footstep-player', {
      schema: {
        minSpeed: { default: 0.02 },
        maxSpeed: { default: 4 }
      },

      init: function () {
        this.previousPosition =
          this.el.object3D.position.clone();

        this.audio =
          document.querySelector('#footstepAudio');

        this.isPlaying = false;

        if (this.audio) {
          this.audio.volume = 0.18;
        }
      },
