      tick: function (time, deltaTime) {
        if (
          !deltaTime ||
          !this.audio
        ) {
          return;
        }

        const currentPosition =
          this.el.object3D.position;

        const deltaX =
          currentPosition.x -
          this.previousPosition.x;

        const deltaZ =
          currentPosition.z -
          this.previousPosition.z;

        const distance =
          Math.sqrt(
            (deltaX * deltaX) +
            (deltaZ * deltaZ)
          );

        const speed =
          distance /
          (deltaTime / 1000);

        const isWalking =
          speed >= this.data.minSpeed &&
          speed <= this.data.maxSpeed;

        const audioUnlocked =
          this.el.sceneEl.audioUnlocked;

        if (
          isWalking &&
          audioUnlocked &&
          !this.isPlaying
        ) {
          const playPromise =
            this.audio.play();

          if (playPromise) {
            playPromise.catch((error) => {
              console.error(
                'Footstep sound failed:',
                error
              );
            });
          }

          this.isPlaying = true;
        } else if (
          (!isWalking ||
           !audioUnlocked) &&
          this.isPlaying
        ) {
          this.audio.pause();
          this.audio.currentTime = 0;
          this.isPlaying = false;
        }

        this.previousPosition.copy(
          currentPosition
        );
      }
    });
  </script>

        silenceMin: 12;
        silenceMax: 25;
        fadeIn: 2.5;
        fadeOut: 2.5;
        startDelay: 4"
      sound="
        src: url(sounds/bedroom-rain.wav);
        autoplay: false;
        loop: true;
        positional: true;
        volume: 0;
        distanceModel: inverse;
        refDistance: 2.2;
        rolloffFactor: 1.25;
        maxDistance: 13">
    </a-entity>

    <a-entity
      id="fluorescentSound"
      class="spatial-sound"
      position="2.5 2.5 1.5"
      independent-ambient-cycle="
        targetVolume: 0.045;
        playMin: 25;
        playMax: 45;
        silenceMin: 6;
        silenceMax: 14;
        fadeIn: 1.5;
        fadeOut: 1.5;
        startDelay: 9"
      sound="
        src: url(sounds/fluorescent-light.wav);
        autoplay: false;
        loop: true;
        positional: true;
        volume: 0;
        distanceModel: inverse;
        refDistance: 1.2;
        rolloffFactor: 2;
        maxDistance: 8">
    </a-entity>

    <a-entity
      id="tvStaticSound"
      class="spatial-sound"
      position="2.2 1.15 -1.8"
      independent-ambient-cycle="
        targetVolume: 0.025;
        playMin: 15;
        playMax: 30;
        silenceMin: 10;
        silenceMax: 20;
        fadeIn: 1.2;
        fadeOut: 0.7;
        startDelay: 15"
      sound="
        src: url(sounds/tv-static.mp3);
        autoplay: false;
        loop: true;
        positional: true;
        volume: 0;
        distanceModel: inverse;
        refDistance: 1;
        rolloffFactor: 2.25;
        maxDistance: 7">
    </a-entity>


    <!-- ======================================================
         SPLIT ROOM MODELS
    ======================================================= -->
    <a-entity
      id="wallandground"
      class="roompart"
      gltf-model="url(wallandground.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Walls and ground">
    </a-entity>


    <a-entity
      id="living"
      class="roompart"
      gltf-model="url(livingasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Living room">
    </a-entity>


    <a-entity
      id="kitchen"
      class="roompart"
      gltf-model="url(kitchenasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Kitchen">
    </a-entity>


    <a-entity
      id="bedroom"
      class="roompart"
      gltf-model="url(bedroomasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Bedroom">
    </a-entity>


    <a-entity
      id="toilet"
      class="roompart"
      gltf-model="url(toiletasset.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Toilet">
    </a-entity>


    <a-entity
      id="bantho"
      class="roompart"
      gltf-model="url(bantho.glb)"
      position="0 0 0"
      tag-floors
      model-status="name: Ban tho">
    </a-entity>


    <!-- ======================================================
         FALLBACK TELEPORT FLOOR
    ======================================================= -->
    <a-plane
      id="fallback-teleport-floor"
      class="floor"

      position="0 0.01 0"
      rotation="-90 0 0"

      width="30"
      height="30"

      material="
        opacity: 0;
        transparent: true;
        depthWrite: false">
    </a-plane>


    <!-- ======================================================
         INTERACTIVE DOOR
    ======================================================= -->
    <a-entity
      id="door"
      class="door"

      gltf-model="url(cua.glb)"

      position="0 0 0"
      rotation="0 0 0"

      door-hinge="
        openAngle: 100;
        hingeSide: left;
        direction: 1;
        duration: 650"

      model-status="name: Door">
    </a-entity>


    <!-- ======================================================
         INTERACTIVE TEDDY

         FIX: position reset to 0 0 0. teddy.glb was exported from
         the full house scene, so its internal glTF node transform
         already places it at its real location in the house
         (world bounding-box center logs to the console once it
         loads — check "-> Teddy bear world bounding box center").
         The previous "1 0.6 -2" was stacked ON TOP of that baked
         transform, which is why it ended up roughly 6-7 metres
         away from where it should be — invisible and unreachable
         by both the cursor raycaster and VR grab proximity.
    ======================================================= -->
    <a-entity
      id="teddy"
      class="item interactable"

      gltf-model="url(teddy.glb)"

      position="0 0 0"

      natural-grabbable

      model-status="name: Teddy bear"

      animation__hoverin="
        property: scale;
        to: 1.1 1.1 1.1;
        startEvents: mouseenter;
        dur: 200"

      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">
    </a-entity>


    <!-- ======================================================
         INTERACTIVE HAIRPIN

         FIX: same double-offset bug as teddy above. position
         reset to 0 0 0 so hairpin.glb's own baked coordinates
         (its real spot in the house) are used directly.
    ======================================================= -->
    <a-entity
      id="hairpin"
      class="item interactable"

      gltf-model="url(hairpin.glb)"

      position="0 0 0"

      natural-grabbable

      model-status="name: Hairpin"

      animation__hoverin="
        property: scale;
        to: 1.2 1.2 1.2;
        startEvents: mouseenter;
        dur: 200"

      animation__hoverout="
        property: scale;
        to: 1 1 1;
        startEvents: mouseleave;
        dur: 200">
    </a-entity>


    <!-- ======================================================
         PLAYER RIG
    ======================================================= -->
    <a-entity
      id="rig"

      position="1 0.08 0.5"

      movement-controls="
        speed: 0.15;
        controls: gamepad, keyboard, touch;
        fly: false"

      quest-room-collider="
        objects: [gltf-model];
        radius: 0.32;
        skin: 0.035;
        maxSubstep: 0.12;
        teleportDistance: 0.75"


      footstep-player="
        minSpeed: 0.02;
        maxSpeed: 4">


      <!-- Camera -->
      <a-entity
        id="cam"

        camera="
          near: 0.01;
          fov: 60"

        position="0 1.6 0"

        look-controls

        head-bob="
          verticalAmount: 0.026;
          sideAmount: 0.014;
          speed: 8.5;
          vrMultiplier: 0.3">


        <!-- Headset-only compact corner exit icon -->
        <a-circle
          id="exitVRButton"
          class="vr-ui"
          vr-only-ui
          camera-corner-ui="
            distance: 2;
            horizontalInset: 0.14;
            verticalInset: 0.17"
          exit-experience
          visible="false"

          radius="0.046"
          segments="48"

          material="
            color: #17191c;
            opacity: 0.94;
            transparent: true;
            shader: flat;
            side: double"

          animation__hoverin="
            property: scale;
            to: 1.12 1.12 1.12;
            startEvents: mouseenter;
            dur: 100"

          animation__hoverout="
            property: scale;
            to: 1 1 1;
            startEvents: mouseleave;
            dur: 100">

          <!-- Thin outer ring -->
          <a-ring
            radius-inner="0.041"
            radius-outer="0.046"
            segments-theta="48"
            position="0 0 0.002"
            material="
              color: #a64a4a;
              opacity: 0.92;
              transparent: true;
              shader: flat;
              side: double">
          </a-ring>

          <!-- Small doorway edge -->
          <a-plane
            width="0.004"
            height="0.034"
            position="-0.014 0 0.005"
            material="
              color: #ffffff;
              shader: flat;
              side: double">
          </a-plane>

          <!-- Exit arrow shaft -->
          <a-plane
            width="0.032"
            height="0.004"
            position="0.003 0 0.006"
            material="
              color: #ffffff;
              shader: flat;
              side: double">
          </a-plane>

          <!-- Exit arrow head -->
          <a-plane
            width="0.017"
            height="0.004"
            rotation="0 0 45"
            position="0.016 0.006 0.007"
            material="
              color: #ffffff;
              shader: flat;
              side: double">
          </a-plane>

          <a-plane
            width="0.017"
            height="0.004"
            rotation="0 0 -45"
            position="0.016 -0.006 0.008"
            material="
              color: #ffffff;
              shader: flat;
              side: double">
          </a-plane>
        </a-circle>


        <!-- Desktop object-holding point -->
        <a-entity
          id="desktopHold"
          position="0 -0.25 -1">
        </a-entity>


        <!-- Desktop cursor -->
        <a-cursor
          color="#ffffff"
          scale="0.7 0.7 0.7"

          cursor="
            rayOrigin: entity;
            fuse: false"

          raycaster="
            objects: #door, #doorCloseTarget, .item;
            far: 3;
            interval: 50">
        </a-cursor>

      </a-entity>


      <!-- Left controller: teleport + natural grab -->
      <a-entity
        id="leftHand"

        hand-controls="
          hand: left"

        blink-controls="
          cameraRig: #rig;
          teleportOrigin: #cam;
          collisionEntities: .floor;
          button: trigger;
          snapTurn: false;
          rotateOnTeleport: false"

        natural-grab-hand="
          radius: 0.4;
          velocitySmoothing: 0.35">
      </a-entity>


      <!-- Right controller: door trigger + natural grab -->
      <a-entity
        id="rightHand"

        hand-controls="
          hand: right"

        raycaster="
          objects: #door, #doorCloseTarget, #exitVRButton;
          far: 3;
          interval: 50;
          showLine: true;
          lineColor: #ffffff;
          lineOpacity: 0.8"

        natural-grab-hand="
          radius: 0.4;
          velocitySmoothing: 0.35"

        vr-door-interactor>

      </a-entity>

    </a-entity>

  </a-scene>
</body>
</html>
